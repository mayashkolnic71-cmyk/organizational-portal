                options: [
                    "כן. החוק מחייב הקלת סבל פליאטיבית בכל מקרה, גם אם קיים סיכון עקיף לקיצור החיים, כל עוד המטרה אינה המתה (עקרון 'האפקט הכפול').",
                    "לא. אסור לתת כל טיפול שעלול לזרז את המוות, זה נחשב לעבירה פלילית של המתת חסד.",
                    "רק אם בני המשפחה חותמים על טופס הסכמה מיוחד מול עורך דין."
                ],
                correctIndex: 0,
                explanation: "מדויק. עקרון 'האפקט הכפול' (Double Effect) מעוגן היטב מקצועית ואתית בחוק ובפסיקה. מותר (ואף חובה מוסרית) לתת טיפול פליאטיבי (מורפין, תרופות הרגעה) כדי למנוע סבל מחולה נוטה למות, כל עוד הכוונה הבלעדית היא הקלת הסבל ולא ביצוע המתה אקטיבית."
            }
        ];
        
        let currentCaseQ = 0;

        function renderCaseStudy() {
            const container = document.getElementById('case-study-root');
            if (!container) return;
            
            if (currentCaseQ >= caseQuestions.length) {
                container.innerHTML = `
                    <div class="bg-green-50 border border-green-200 rounded-lg p-6 text-center animate-fadeIn">
                        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold text-green-800 mb-2">מצוין! סיימת את ניתוח המקרה הקליני.</h3>
                        <p class="text-green-700">הפגנת ידע מצוין ביישום החוק במצבי אמת במחלקה.</p>
                        <button onclick="document.getElementById('btn-next').click()" class="mt-4 bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition-colors shadow-md">המשך למבחן המסכם</button>
                    </div>
                `;
                return;
            }

            const qData = caseQuestions[currentCaseQ];
            
            let optionsHtml = '';
            qData.options.forEach((opt, idx) => {
                optionsHtml += `
                    <button onclick="handleCaseAnswer(${idx})" class="w-full text-right p-4 border border-gray-200 rounded-lg hover:bg-blue-50 hover:border-blue-300 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3 text-gray-700 font-medium">
                        ${idx + 1}. ${opt}
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-5 mb-6 text-yellow-900 shadow-sm">
                    <h4 class="font-bold flex items-center gap-2 mb-2">
                        <svg class="w-5 h-5 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        נתוני המקרה הקליני:
                    </h4>
                    <p class="text-sm leading-relaxed">${qData.scenario}</p>
                </div>
                
                <div class="mb-4">
                    <h4 class="text-lg font-bold text-slate-800 mb-4">${qData.q}</h4>
                    <div id="case-options">
                        ${optionsHtml}
                    </div>
                </div>
                <div id="case-feedback" class="hidden rounded-lg p-4 mt-4 animate-fadeIn"></div>
            `;
        }

        function handleCaseAnswer(selectedIndex) {
            const qData = caseQuestions[currentCaseQ];
            const feedbackEl = document.getElementById('case-feedback');
            const optionsContainer = document.getElementById('case-options');
            
            // השבתת הכפתורים לאחר בחירה
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === qData.correctIndex) {
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                    btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-300');
                } else if (idx === selectedIndex) {
                    btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                    btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-300');
                } else {
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            });

            feedbackEl.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'bg-red-50', 'text-red-800');
            
            if (selectedIndex === qData.correctIndex) {
                feedbackEl.classList.add('bg-green-50', 'border', 'border-green-200', 'text-green-800');
                feedbackEl.innerHTML = `
                    <div class="font-bold mb-1 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        תשובה נכונה!
                    </div>
                    <p class="text-sm">${qData.explanation}</p>
                    <button onclick="nextCaseQuestion()" class="mt-3 text-sm font-bold text-green-900 underline hover:text-green-700">המשך לשאלה הבאה</button>
                `;
            } else {
                feedbackEl.classList.add('bg-red-50', 'border', 'border-red-200', 'text-red-800');
                feedbackEl.innerHTML = `
                    <div class="font-bold mb-1 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        תשובה שגויה.
                    </div>
                    <p class="text-sm">${qData.explanation}</p>
                    <button onclick="nextCaseQuestion()" class="mt-3 text-sm font-bold text-red-900 underline hover:text-red-700">הבנתי, המשך הלאה</button>
                `;
            }
        }

        function nextCaseQuestion() {
            currentCaseQ++;
            renderCaseStudy();
        }
        // ---------------------------------------------

        // רכיבי DOM
        const progressBarContainer = document.getElementById('progress-bar');
        const contentContainer = document.getElementById('content-container');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const stepCounter = document.getElementById('step-counter');

        // פונקציה לאתחול סרגל ההתקדמות
        function initProgressBar() {
            progressBarContainer.innerHTML = '';
            stepsData.forEach((step, index) => {
                const stepElement = document.createElement('div');
                stepElement.className = `flex-1 min-w-[120px] flex flex-col items-center py-3 px-2 border-b-4 transition-colors duration-300 cursor-pointer sm:cursor-default`;
                stepElement.onclick = () => goToStep(index);
                
                stepElement.innerHTML = `
                    <div class="step-title-text text-sm md:text-base font-bold">
                        שלב ${step.id}
                    </div>
                    <div class="hidden md:block text-xs text-gray-500 truncate w-full text-center px-1">
                        ${step.title}
                    </div>
                `;
                progressBarContainer.appendChild(stepElement);
            });
        }

        // פונקציה לעדכון התצוגה לפי השלב הנוכחי
        function renderStep() {
            const step = stepsData[currentStep];
            
            // עדכון סרגל התקדמות
            const progressTabs = progressBarContainer.children;
            for (let i = 0; i < progressTabs.length; i++) {
                const tab = progressTabs[i];
                const titleText = tab.querySelector('.step-title-text');
                
                // איפוס מחלקות
                tab.className = `flex-1 min-w-[120px] flex flex-col items-center py-3 px-2 border-b-4 transition-colors duration-300 cursor-pointer sm:cursor-default`;
                
                if (i === currentStep) {
                    tab.classList.add('border-blue-600', 'bg-blue-50');
                    titleText.className = 'step-title-text text-sm md:text-base font-bold text-blue-800';
                } else if (i < currentStep) {
                    tab.classList.add('border-green-400', 'opacity-70');
                    titleText.className = 'step-title-text text-sm md:text-base font-bold text-gray-500';
                } else {
                    tab.classList.add('border-transparent', 'opacity-40', 'hover:bg-gray-50');
                    titleText.className = 'step-title-text text-sm md:text-base font-bold text-gray-500';
                }
            }

            // יצירת תוכן השלב עם אנימציה
            contentContainer.innerHTML = `
                <div class="step-content active">
                    <div class="flex items-center gap-4 mb-6 pb-4 border-b border-gray-100">
                        <div class="p-3 bg-blue-50 rounded-xl">
                            ${step.iconSvg}
                        </div>
                        <div>
                            <h2 class="text-2xl sm:text-3xl font-bold text-gray-800">
                                ${step.title}
                            </h2>
                            <h3 class="text-lg text-gray-500 font-medium mt-1">
                                ${step.subtitle}
                            </h3>
                        </div>
                    </div>
                    <div>
                        ${step.htmlContent}
                    </div>
                </div>
            `;
            
            // אתחול רכיב תיאור המקרה במידה ואנחנו בשלב 4 (אינדקס 3)
            if (currentStep === 3) {
                currentCaseQ = 0; 
                renderCaseStudy();
            }

            // עדכון מונה שלבים
            stepCounter.textContent = `${currentStep + 1} / ${stepsData.length}`;

            // עדכון מצב כפתורים
            if (currentStep === 0) {
                btnPrev.disabled = true;
                btnPrev.className = "flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium transition-all duration-200 bg-gray-200 text-gray-400 cursor-not-allowed";
            } else {
                btnPrev.disabled = false;
                btnPrev.className = "flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium transition-all duration-200 bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 hover:text-blue-600";
            }

            if (currentStep === stepsData.length - 1) {
                btnNext.disabled = true;
                btnNext.className = "flex items-center gap-2 px-6 py-2.5 rounded-lg font-medium transition-all duration-200 bg-gray-200 text-gray-400 cursor-not-allowed hidden sm:flex";
            } else {
                btnNext.disabled = false;
                btnNext.className = "flex items-center gap-2 px-6 py-2.5 rounded-lg font-medium transition-all duration-200 bg-blue-600 text-white hover:bg-blue-700 shadow-md hover:shadow-lg";
            }
        }

        // פונקציות ניווט
        function goToStep(index) {
            if (index >= 0 && index < stepsData.length) {
                currentStep = index;
                renderStep();
            }
        }

        btnNext.addEventListener('click', () => {
            if (currentStep < stepsData.length - 1) {
                goToStep(currentStep + 1);
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                goToStep(currentStep - 1);
            }
        });

        // אתחול האפליקציה
        initProgressBar();
        renderStep();
        
    </script>
</body>
</html>
