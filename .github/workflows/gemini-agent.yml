name: Weekly Gemini Content Agent

on:
  schedule:
    # Runs at 08:00 UTC every Sunday
    - cron: '0 8 * * 0'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  generate-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Run Gemini Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/weekly_agent.js
        
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add weekly_content.json
          git commit -m "Automated update: Weekly content from Gemini Agent" || echo "No changes to commit"
          git push
