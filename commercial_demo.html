<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דמו, סרטון והצעה עסקית | הפורטל הארגוני לניהול איכות בסיעוד</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=70">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1e40af;
            --surface: #ffffff;
            --bg-color: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        .btn {
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        @media print {
            body * { visibility: hidden; }
            #proposal-printable-content, #proposal-printable-content * { visibility: visible; }
            #proposal-printable-content { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Top Sticky Bar -->
    <header style="background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; padding: 12px 24px;">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 26px;">⚕️</span>
                <div>
                    <h2 style="margin: 0; font-size: 16px; font-weight: 900; color: #1e3a8a;">הפורטל הארגוני לניהול איכות ובטיחות בסיעוד</h2>
                    <span style="font-size: 11.5px; color: var(--text-secondary);">מודל הבקרה האחודה 2026 | מומחית הטמעה: מאיה שקולניק גזית (R.N, BA, M.H.A)</span>
                </div>
            </div>

            <div style="display: flex; gap: 10px; align-items: center;">
                <a href="index.html" class="btn" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
                    <span>➜</span> כניסה לפורטל המלא
                </a>
                <button onclick="switchDemoSubTab('lead_form')" class="btn" style="background: #10b981; color: white; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 6px rgba(16,185,129,0.3);">
                    <span>📅</span> תאם הדגמה חיה
                </button>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 24px; padding-bottom: 60px;">
        <div id="content-area"></div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script src="script_v6.js?v=70"></script>
    <script>
        // Init on page load
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof renderCommercialDemoView === 'function') {
                renderCommercialDemoView();
            }
        });
    </script>
</body>
</html>
